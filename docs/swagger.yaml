basePath: /
definitions:
  main.Credentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  main.Item:
    properties:
      category_id:
        type: string
      description:
        type: string
      name:
        description: Itemid        string  `gorm:"primaryKey;column:item_id" json:"item_id"`
        type: string
      price:
        type: integer
      quantitystock:
        type: integer
    type: object
  main.OrderItem:
    properties:
      item_id:
        type: integer
      order_id:
        description: OrderItemid   string  `gorm:"primaryKey;column:orderitem_id"
          json:"orderitem_id"`
        type: integer
      package_id:
        type: string
      quantity:
        type: integer
      quantity_package:
        type: integer
      sum_price_item:
        type: integer
      sum_price_package:
        type: number
      user_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Это API для интернет-магазина мягких игрушек
  title: Bakery API
  version: "1.0"
paths:
  /basket:
    delete:
      consumes:
      - application/json
      description: Remove a item from the user's basket
      parameters:
      - description: Item ID
        in: query
        name: item_id
        required: true
        type: integer
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Delete From Basket
      tags:
      - basket
    post:
      consumes:
      - application/json
      description: Add a new item to the user's basket by user_id and item_id
      parameters:
      - description: User ID
        in: query
        name: user_id1
        required: true
        type: integer
      - description: Item ID
        in: query
        name: item_id1
        required: true
        type: integer
      - description: Basket item details (e.g., quantity)
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/main.OrderItem'
      produces:
      - application/json
      responses:
        "201":
          description: Item added to basket successfully
          schema:
            $ref: '#/definitions/main.OrderItem'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to add item to basket
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Add To Basket
      tags:
      - basket
  /basket/items:
    get:
      consumes:
      - application/json
      description: Возвращает список товаров в корзине по user_id
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.OrderItem'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Получить все позиции корзины пользователя
      tags:
      - basket
  /items:
    get:
      consumes:
      - application/json
      description: Get a list of products with pagination, sorting, and filtering
        options
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Product name
        in: query
        name: name
        type: string
      - description: Product category
        in: query
        name: category_id
        type: string
      - description: Sort by field (e.g., field_name:asc or field_name:desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenAuth: []
      summary: getItems
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Add a new item to the stock
      parameters:
      - description: New item details
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/main.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Item created successfully
          schema:
            $ref: '#/definitions/main.Item'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Create item
      tags:
      - items
  /items/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a item from the catalog by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Message indicating successful deletion
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Item not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Delete Item
      tags:
      - items
    get:
      consumes:
      - application/json
      description: Get a single item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Item'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Get Item by ID
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an existing item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated item
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/main.Item'
      produces:
      - application/json
      responses:
        "200":
          description: Updated item details
          schema:
            $ref: '#/definitions/main.Item'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Item not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: Обновление товара
      tags:
      - items
  /login:
    post:
      consumes:
      - application/json
      description: Logs in a user and returns access and refresh tokens
      parameters:
      - description: Данные для входа
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/main.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: '{"accesstoken": "string", "refreshtoken": "string"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '{"message": "string"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: '{"message": "string"}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TokenAuth: []
      summary: login
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя с уникальным логином и хешированным
        паролем
      parameters:
      - description: Данные для регистрации (логин и пароль)
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.Credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно зарегистрирован
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Пользователь уже существует
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - auth
securityDefinitions:
  TokenAuth:
    description: Введите ваш токен напрямую в заголовке Authorization
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
